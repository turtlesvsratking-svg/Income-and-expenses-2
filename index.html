<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブログ収支マネージャー | おしえてかめさん</title>

  <!-- PWA & ホーム画面アイコン設定 (4711画像) -->
  <link rel="icon" href="./4711.png" type="image/png">
  <link rel="apple-touch-icon" href="./4711.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2e7d32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="収支マネージャー">

  <link rel="stylesheet" href="./style.css">
  <!-- Google Fonts: Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-logo">
        <img src="./4711.png" alt="アプリアイコン" class="app-icon-img">
        <h1>ブログ収支マネージャー</h1>
      </div>
      <p class="subtitle">通算収支をリアルタイムに集計・管理</p>
    </header>

    <!-- 収支サマリーカード -->
    <section class="summary-grid">
      <div class="card summary-card income">
        <h3>総収入</h3>
        <p class="amount" id="total-income">¥0</p>
      </div>
      <div class="card summary-card expense">
        <h3>総経費</h3>
        <p class="amount" id="total-expense">¥0</p>
      </div>
      <div class="card summary-card balance">
        <h3>通算収支</h3>
        <p class="amount" id="net-balance">¥0</p>
      </div>
    </section>

    <!-- 入力フォーム -->
    <section class="card form-card">
      <h2>新規データの追加</h2>
      <form id="transaction-form">
        <div class="form-row">
          <div class="form-group">
            <label for="type">種別</label>
            <select id="type" required>
              <option value="income">収入</option>
              <option value="expense">経費</option>
            </select>
          </div>
          <div class="form-group">
            <label for="category">カテゴリー</label>
            <select id="category" required>
              <!-- JSで動的に切替 -->
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="amount">金額 (円)</label>
            <input type="number" id="amount" placeholder="1000" min="1" required>
          </div>
          <div class="form-group">
            <label for="memo">メモ (任意)</label>
            <input type="text" id="memo" placeholder="例: 8月分振込、サーバー代など">
          </div>
        </div>

        <button type="submit" class="btn btn-primary">追加する</button>
      </form>
    </section>

    <!-- カテゴリー別内訳 -->
    <section class="card breakdown-card">
      <h2>収入内訳</h2>
      <div class="category-grid" id="category-breakdown">
        <!-- JSで動的に生成 -->
      </div>
    </section>

    <!-- 履歴・データ管理 -->
    <section class="card history-card">
      <div class="history-header">
        <h2>取引履歴</h2>
        <div class="data-actions">
          <button id="export-btn" class="btn btn-secondary">データ出力 (JSON)</button>
          <label for="import-file" class="btn btn-secondary import-label">
            データ復元
            <input type="file" id="import-file" accept=".json" style="display: none;">
          </label>
          <button id="clear-btn" class="btn btn-danger">全消去</button>
        </div>
      </div>
      <ul id="history-list" class="history-list">
        <!-- JSで動的に生成 -->
      </ul>
    </section>

    <footer class="app-footer">
      <p>&copy; おしえてかめさん - ブログ運営ツール</p>
    </footer>
  </div>

  <script src="./app.js"></script>
</body>
</html>
