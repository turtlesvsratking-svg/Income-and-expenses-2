<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブログ収支マネージャー | おしえてかめさん</title>

  <!-- PWA & Icon Settings -->
  <link rel="icon" href="./4711.png" type="image/png">
  <link rel="apple-touch-icon" href="./4711.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2e7d32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="収支マネージャー">

  <!-- Style & Fonts -->
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-logo">
        <img src="./4711.png" alt="アプリアイコン" class="app-icon-img">
        <h1>ブログ収支マネージャー</h1>
      </div>
      <p class="subtitle">通算収支のリアルタイム集計・自動解析ツール</p>
    </header>

    <!-- 収支サマリーカード -->
    <section class="summary-grid" aria-label="収支概要">
      <div class="card summary-card income">
        <h2>総収入</h2>
        <p class="amount" id="total-income">¥0</p>
      </div>
      <div class="card summary-card expense">
        <h2>総経費</h2>
        <p class="amount" id="total-expense">¥0</p>
      </div>
      <div class="card summary-card balance">
        <h2>通算差引額</h2>
        <p class="amount" id="net-balance">¥0</p>
      </div>
    </section>

    <!-- GAS連携設定パネル（URL初期埋め込み） -->
    <section class="card config-card">
      <details>
        <summary>⚙️ Googleスプレッドシート自動連携設定（GAS）</summary>
        <div class="config-content">
          <label for="gas-url">GAS Web App URL:</label>
          <input 
            type="url" 
            id="gas-url" 
            value="https://script.google.com/macros/s/AKfycbw7FUZq0FQzV26jqsrfk14FpmbiUisF1Zw6zszvMirJk-MUuP6hthBBKim3zz2JdEBb/exec" 
            placeholder="https://script.google.com/macros/s/.../exec"
          >
          <p class="help-text">※設定されたスプレッドシートへ自動同期されます（変更・上書きも可能）。</p>
        </div>
      </details>
    </section>

    <!-- データ入力フォーム -->
    <section class="card form-card">
      <h2>新規データの登録</h2>
      <form id="transaction-form">
        <div class="form-row">
          <div class="form-group">
            <label for="type">区分</label>
            <select id="type" required>
              <option value="income">収入</option>
              <option value="expense">経費</option>
            </select>
          </div>
          <div class="form-group">
            <label for="category">カテゴリー</label>
            <select id="category" required>
              <!-- JSで動的に設定 -->
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="amount">金額（円）</label>
            <input type="number" id="amount" placeholder="例: 5000" min="1" required>
          </div>
          <div class="form-group">
            <label for="memo">メモ（任意）</label>
            <input type="text" id="memo" placeholder="例: 振込明細、サーバー費用など">
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">登録する</button>
      </form>
    </section>

    <!-- グラフ ＆ カテゴリー別分析 -->
    <section class="card breakdown-card">
      <h2>収入内訳・比率分析</h2>
      <div class="analytics-container">
        <div class="chart-wrapper">
          <canvas id="income-chart"></canvas>
        </div>
        <div class="category-grid" id="category-breakdown">
          <!-- JSで動的に生成 -->
        </div>
      </div>
    </section>

    <!-- 取引履歴 ＆ データ管理 -->
    <section class="card history-card">
      <div class="history-header">
        <h2>取引履歴</h2>
        <div class="data-actions">
          <button id="export-btn" class="btn btn-secondary">JSONエクスポート</button>
          <label for="import-file" class="btn btn-secondary import-label">
            復元 (JSON)
            <input type="file" id="import-file" accept=".json" style="display: none;">
          </label>
          <button id="clear-btn" class="btn btn-danger">全消去</button>
        </div>
      </div>
      <ul id="history-list" class="history-list">
        <!-- JSで動的に生成 -->
      </ul>
    </section>

    <footer class="app-footer">
      <p>&copy; おしえてかめさん - ブログ運営ツール</p>
    </footer>
  </div>

  <script src="./app.js"></script>
</body>
</html>
